[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computelayer"
version = "0.1.0"
description = "Deterministic incremental compute for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ComputeLayer" }]
keywords = ["llm", "agents", "cache", "incremental", "memoization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

# The core is deliberately dependency-free: canonical serialization, hashing,
# fingerprints and reuse semantics are pure standard library, so they can be
# imported anywhere (including inside the API) without pulling in a stack.
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
redis = ["redis>=5.0"]
all = ["httpx>=0.27", "redis>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
computelayer = "computelayer.cli:main"

[project.urls]
Documentation = "https://github.com/computelayer/computelayer/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["computelayer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
